<div style="width:100%;height:420px;position:relative;border-radius:12px;overflow:hidden;background:var(--surface-1);">
<canvas id="c" style="width:100%;height:100%;display:block;"></canvas>
<div style="position:absolute;bottom:8px;left:12px;font-size:12px;color:var(--text-muted);">Sichqoncha bilan aylantiring</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var container = document.getElementById('c');
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(45, container.clientWidth/container.clientHeight, 0.1, 100);
  camera.position.set(0, 2.2, 7);
  var renderer = new THREE.WebGLRenderer({canvas: container, antialias:true, alpha:true});
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio || 1);

  var amb = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(amb);
  var dir = new THREE.DirectionalLight(0xffffff, 0.6);
  dir.position.set(3,5,4);
  scene.add(dir);

  var rig = new THREE.Group();
  scene.add(rig);

  var bodyColor = 0xE8E8E6;
  var darkColor = 0x2C2C2A;
  var accentColor = 0x0096D6;

  // Monitor
  var monGroup = new THREE.Group();
  var screenFrame = new THREE.Mesh(
    new THREE.BoxGeometry(3.2, 2.0, 0.12),
    new THREE.MeshStandardMaterial({color: darkColor})
  );
  monGroup.add(screenFrame);
  var screen = new THREE.Mesh(
    new THREE.PlaneGeometry(2.9, 1.7),
    new THREE.MeshStandardMaterial({color: 0x0b1c2b, emissive: 0x0b3a5c, emissiveIntensity: 0.4})
  );
  screen.position.z = 0.065;
  monGroup.add(screen);
  var neck = new THREE.Mesh(
    new THREE.BoxGeometry(0.25, 0.6, 0.15),
    new THREE.MeshStandardMaterial({color: darkColor})
  );
  neck.position.y = -1.3;
  monGroup.add(neck);
  var base = new THREE.Mesh(
    new THREE.CylinderGeometry(0.6, 0.6, 0.08, 32),
    new THREE.MeshStandardMaterial({color: darkColor})
  );
  base.position.y = -1.62;
  monGroup.add(base);
  monGroup.position.y = 1.6;
  rig.add(monGroup);

  // "hp" label on screen bezel
  var canvas2 = document.createElement('canvas');
  canvas2.width = 256; canvas2.height = 128;
  var ctx = canvas2.getContext('2d');
  ctx.fillStyle = '#0096D6';
  ctx.beginPath();
  ctx.arc(128,64,60,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 60px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('hp', 128, 70);
  var logoTex = new THREE.CanvasTexture(canvas2);
  var logo = new THREE.Mesh(
    new THREE.PlaneGeometry(0.35, 0.175),
    new THREE.MeshBasicMaterial({map: logoTex, transparent:true})
  );
  logo.position.set(0, -0.82, 0.07);
  monGroup.add(logo);

  // Tower (desktop unit)
  var towerGroup = new THREE.Group();
  var towerBody = new THREE.Mesh(
    new THREE.BoxGeometry(1.0, 2.2, 1.9),
    new THREE.MeshStandardMaterial({color: bodyColor})
  );
  towerGroup.add(towerBody);
  var frontPanel = new THREE.Mesh(
    new THREE.BoxGeometry(0.02, 2.2, 1.9),
    new THREE.MeshStandardMaterial({color: darkColor})
  );
  frontPanel.position.x = 0.51;
  towerGroup.add(frontPanel);
  var powerBtn = new THREE.Mesh(
    new THREE.CylinderGeometry(0.06,0.06,0.03,16),
    new THREE.MeshStandardMaterial({color: accentColor})
  );
  powerBtn.rotation.z = Math.PI/2;
  powerBtn.position.set(0.53, 0.9, 0);
  towerGroup.add(powerBtn);
  towerGroup.position.set(2.1, 0.1, 0);
  rig.add(towerGroup);

  // Keyboard
  var keyboard = new THREE.Mesh(
    new THREE.BoxGeometry(2.2, 0.08, 0.8),
    new THREE.MeshStandardMaterial({color: bodyColor})
  );
  keyboard.position.set(-0.3, -1.68, 1.4);
  rig.add(keyboard);

  // Mouse
  var mouse = new THREE.Mesh(
    new THREE.SphereGeometry(0.16, 16, 16),
    new THREE.MeshStandardMaterial({color: bodyColor})
  );
  mouse.scale.set(1, 0.5, 1.4);
  mouse.position.set(1.2, -1.66, 1.4);
  rig.add(mouse);

  // Desk surface
  var desk = new THREE.Mesh(
    new THREE.BoxGeometry(6, 0.1, 3),
    new THREE.MeshStandardMaterial({color: 0xC9BBA6})
  );
  desk.position.y = -1.75;
  rig.add(desk);

  rig.position.x = -0.8;

  var isDragging = false, prevX = 0, prevY = 0;
  var rotY = 0.3, rotX = 0.15;
  function applyRot(){
    rig.rotation.y = rotY;
    rig.rotation.x = rotX;
  }
  applyRot();

  container.style.cursor = 'grab';
  container.addEventListener('mousedown', function(e){
    isDragging = true; prevX = e.clientX; prevY = e.clientY;
    container.style.cursor = 'grabbing';
  });
  window.addEventListener('mouseup', function(){
    isDragging = false; container.style.cursor = 'grab';
  });
  window.addEventListener('mousemove', function(e){
    if(!isDragging) return;
    var dx = e.clientX - prevX, dy = e.clientY - prevY;
    prevX = e.clientX; prevY = e.clientY;
    rotY += dx * 0.008;
    rotX += dy * 0.006;
    rotX = Math.max(-0.6, Math.min(0.6, rotX));
    applyRot();
  });
  container.addEventListener('touchstart', function(e){
    isDragging = true; prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
  });
  window.addEventListener('touchend', function(){ isDragging = false; });
  window.addEventListener('touchmove', function(e){
    if(!isDragging) return;
    var t = e.touches[0];
    var dx = t.clientX - prevX, dy = t.clientY - prevY;
    prevX = t.clientX; prevY = t.clientY;
    rotY += dx * 0.008;
    rotX += dy * 0.006;
    rotX = Math.max(-0.6, Math.min(0.6, rotX));
    applyRot();
  });

  var autoRotate = true;
  function animate(){
    requestAnimationFrame(animate);
    if(autoRotate && !isDragging){
      rotY += 0.002;
      applyRot();
    }
    renderer.render(scene, camera);
  }
  container.addEventListener('mousedown', function(){ autoRotate = false; });
  container.addEventListener('touchstart', function(){ autoRotate = false; });

  window.addEventListener('resize', function(){
    var w = container.clientWidth, h = container.clientHeight;
    if(w>0 && h>0){
      camera.aspect = w/h;
      camera.updateProjectionMatrix();
      renderer.setSize(w,h);
    }
  });

  animate();
})();
</script>
